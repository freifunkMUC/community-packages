# override setting from 31-gluon-mesh-batman-adv.conf
net.ipv6.conf.br-client.forwarding=1

# Only answer ARP for addresses that are configured on br-client itself.
# Every node carries address4 on its wg_c+ interfaces, whether it routes
# for clients or not, and Linux answers ARP for any local address on any
# interface by default. Without this every node on the mesh answers for
# the client gateway, and the clients pick whichever reply arrives last.
net.ipv4.conf.br-client.arp_ignore=1
